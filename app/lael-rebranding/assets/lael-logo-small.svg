<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlowSmall" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A44A5C;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#6B0F1A;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="innerGlowSmall" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A44A5C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6B0F1A;stop-opacity:1"/>
    </radialGradient>
  </defs>
  
  <!-- Pulse rings -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#3A0A12" stroke-width="0.5" opacity="0.3"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#6B0F1A" stroke-width="0.75" opacity="0.4"/>
  
  <!-- Core layers -->
  <circle cx="64" cy="64" r="44" fill="url(#coreGlowSmall)"/>
  <circle cx="64" cy="64" r="40" fill="#3A0A12"/>
  <circle cx="64" cy="64" r="32" fill="#6B0F1A"/>
  <circle cx="64" cy="64" r="24" fill="url(#innerGlowSmall)"/>
  
  <!-- The L -->
  <text 
    x="64" 
    y="74" 
    text-anchor="middle" 
    fill="#A44A5C" 
    font-family="Georgia, serif" 
    font-size="36" 
    font-style="italic"
  >L</text>
  
  <!-- Choso cross mark -->
  <g transform="translate(64, 24)">
    <rect x="-8" y="-2" width="16" height="4" fill="#6B0F1A" rx="1"/>
    <rect x="-2" y="-6" width="4" height="12" fill="#6B0F1A" rx="1"/>
  </g>
</svg>
