<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lael">
  <title>Lael</title>
  <defs>
    <radialGradient id="lael-obsidian" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1A1A1D"/>
      <stop offset="60%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="lael-drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B0F1A"/>
      <stop offset="70%" stop-color="#3A0A12"/>
      <stop offset="100%" stop-color="#2A070D"/>
    </linearGradient>
    <linearGradient id="lael-letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B85A6C"/>
      <stop offset="100%" stop-color="#A44A5C"/>
    </linearGradient>
    <filter id="lael-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- Outer ring: crimson halo -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#6B0F1A" stroke-width="1.25" opacity="0.85"/>
  <circle cx="32" cy="32" r="28.25" fill="none" stroke="#3A0A12" stroke-width="0.75" opacity="0.7"/>

  <!-- Obsidian disc -->
  <circle cx="32" cy="32" r="27" fill="url(#lael-obsidian)"/>

  <!-- Subtle inner wine ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#3A0A12" stroke-width="0.5" opacity="0.55"/>

  <!-- Letter L — Georgia-esque serif form, rose gradient -->
  <g filter="url(#lael-soft)">
    <path d="M24 16 L24 44 L44 44 L44 40 L28 40 L28 16 Z"
          fill="url(#lael-letter)"
          stroke="#6B0F1A"
          stroke-width="0.5"
          stroke-linejoin="round"/>
    <!-- Serif feet on vertical stroke -->
    <rect x="21" y="15" width="10" height="2.2" fill="url(#lael-letter)" stroke="#6B0F1A" stroke-width="0.4"/>
    <rect x="21" y="39.8" width="10" height="2.2" fill="url(#lael-letter)" stroke="#6B0F1A" stroke-width="0.4"/>
    <!-- Serif on horizontal stroke end -->
    <rect x="42" y="38.5" width="3" height="7" fill="url(#lael-letter)" stroke="#6B0F1A" stroke-width="0.4"/>
  </g>

  <!-- Blood drip at base of L -->
  <g>
    <!-- Main drip -->
    <path d="M28 44
             Q28 47 28.8 49
             Q29.6 51 30 52.5
             Q30 54 28.5 54
             Q27 54 27 52.5
             Q27.4 51 28.2 49
             Q29 47 28 44 Z"
          fill="url(#lael-drip)"/>
    <!-- Small trailing droplet -->
    <circle cx="34" cy="47" r="0.9" fill="#6B0F1A" opacity="0.85"/>
    <circle cx="34" cy="49.6" r="0.55" fill="#3A0A12" opacity="0.75"/>
  </g>

  <!-- Faint vein tracing on lower arc -->
  <path d="M10 40 Q18 48 24 47 Q30 46 34 50 Q40 54 52 44"
        fill="none"
        stroke="#6B0F1A"
        stroke-width="0.6"
        opacity="0.25"
        stroke-linecap="round"/>
</svg>
